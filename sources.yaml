# Human-maintained source selection for the generated-process POC.
# Resolved revisions, retrieval times, and content hashes will be written to a
# generated lock file rather than maintained here.
schema_version: 1

sources:
  - id: efv-techdoc
    title: Eligibility Factor Verification TechDoc
    type: docx
    location: sources/EFV TechDoc - V3.docx
    order: 30

  - id: connected-services-getting-started
    title: Connected Services - Getting Started
    type: git
    repository: https://github.com/bcgov/connected-services-techdocs.git
    ref: feature/aps-4786-sdx-techdocs
    root: getting-started
    navigation: mkdocs.yml
    include:
      - docs/**/*.md
    order: 10

  - id: aps-infra-platform-sdx
    title: APS Infrastructure Platform - SDX Documentation
    type: git
    repository: https://github.com/bcgov/aps-infra-platform.git
    ref: test
    root: .
    navigation: mkdocs.yml
    techdocs_component: aps-infra-platform-docs
    include:
      - documentation/concepts/secure-data-exchange.md
      - documentation/how-to/sdx-*.md
      # Linked from the selected SDX/Connected Services pages; keep in this
      # source for now even though they sit outside the SDX how-to section.
      - documentation/how-to/get-support.md
      - documentation/reference/restish-cli.md
      - documentation/reference/sdx/data-access-protocol.md
      - documentation/reference/sdx/environments.md
    assets:
      - documentation/artifacts/SDX.svg
    order: 20
