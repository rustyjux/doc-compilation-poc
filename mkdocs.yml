site_name: Provider Journey Master Documentation
site_description: Generated provider journey master documentation proof of concept
docs_dir: .work/pages
site_dir: site

theme:
  name: material
  features:
    - navigation.top
    - toc.follow
    - content.tabs.link

nav:
  - Master documentation: index.md
  - Source manifest: manifest.md
  - Validation report: validation-report.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
